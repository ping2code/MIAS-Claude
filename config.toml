# MIAS-Claude configuration. Secrets never go here: they come from the environment
# (MASSIVE_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID), optionally via a .env file.

[watchlist]
# The 30 symbols passing the options screen on 2026-10-08 (dashboard /screen, `python -m mias screen`),
# plus the 12 added on 2026-10-24.
# /trend in Telegram works for any symbol, watched or not.
symbols = [
  # Market and macro ETFs
  "SPY", "QQQ", "IWM", "DIA", "TQQQ", "GLD", "SLV", "TLT", "XLE",
  # Semiconductors
  "NVDA", "AMD", "AVGO", "MU", "SNDK", "INTC", "TSM",
  # Mega-cap tech and communication
  "AAPL", "MSFT", "GOOGL", "META", "AMZN", "NFLX", "ORCL", "NOW", "PLTR",
  # Other
  "TSLA", "MSTR", "HOOD", "BAC", "WMT",
  # Added 2026-10-24
  "SOXL", "ARM", "DELL", "IREN", "OKLO", "BE", "GS", "ASTS", "BMNR", "GLXY", "SOFI",
  # Indexes (see [instruments.*])
  "NDX", "SPX",
]
market_symbols = ["SPY", "QQQ", "IWM"]

# Four sectors that tend to rotate (added 2026-10-24). Each has an ETF as its gauge. Members and ETFs are added
# to the watchlist automatically, so a symbol can live here without being repeated above. The sector board
# (ranked by the members' average swing score) heads every digest and the closing summary, and answers /sector.
[sectors.tech]
name = "Tech & Semis"
etf = "SMH"
symbols = ["NVDA", "MU", "AMD", "AVGO", "META", "MSFT", "AMZN", "GOOGL", "AAPL", "PLTR"]

[sectors.financials]
name = "Financials"
etf = "XLF"
symbols = ["GS", "JPM", "V", "HOOD", "COIN"]

[sectors.energy]
name = "Energy"
etf = "XLE"
symbols = ["XOM", "CVX", "OXY", "USO"]

[sectors.defensive]
name = "Defensive"
etf = "XLV"
symbols = ["LLY", "UNH", "COST", "WMT", "PG"]

[schedule]
interval_seconds = 150          # one cycle every 2.5 minutes while the market is open
timezone = "America/New_York"
# Scheduled digests (exchange time). A closing summary is always sent at the close.
digest_times = ["09:50", "11:30", "13:30", "15:30"]

[data]
base_url = "https://api.massive.com"
# Stocks Advanced (real time) since 2026-10-07. Set to 15 if ever back on Stocks Starter.
stock_delay_minutes = 0
max_concurrency = 8
request_timeout_seconds = 20
max_retries = 4
# Chain scope fetched each cycle: expirations up to N days out, strikes within +/- pct of spot.
chain_max_dte = 100            # covers the 50-100 DTE contracts used for swing trades
chain_strike_pct = 0.15
max_chain_pages = 40

[trend]
# Which profile drives the headline trend and the trend-change alerts.
# "swing" suits holding options for weeks; "intraday" reacts within the day.
profile = "swing"
strong_threshold = 60
bias_threshold = 25

[trend.profiles]
swing = { "1w" = 0.35, "1d" = 0.45, "1h" = 0.20 }
intraday = { "5m" = 0.25, "15m" = 0.30, "1h" = 0.30, "1d" = 0.15 }

[options]
# A single contract trading at least this much premium in one cycle is reported as a block.
block_premium = 1_000_000
# Unusual: today's volume exceeds open interest * ratio with at least this much premium.
unusual_min_premium = 500_000
unusual_vol_oi_ratio = 1.0
# Same-day expiries always trade above OI; they still count in flow scores but not as unusual/blocks.
alert_0dte = false
# A symbol trading fewer option contracts than this today has its options read marked thin
# (FICO, for example) and left out of the confidence verdict.
thin_options_volume = 5000

# Number of most recent cycles counted as "recent flow" (6 x 2.5 min = 15 min).
recent_windows = 6
strong_threshold = 60
bias_threshold = 25

# Contracts shown with /trend. "swing" follows the swing trend, "day" follows the intraday trend.
# Liquid = two-sided quote with spread <= max_spread_pct of mid and open interest >= min_oi.
[options.ideas.swing]
min_dte = 50
max_dte = 100
delta = 0.60
max_spread_pct = 10
min_oi = 100

[options.ideas.day]
min_dte = 1          # set 0 to allow same-day expiries
max_dte = 14
delta = 0.45
max_spread_pct = 5
min_oi = 200

[instruments.NDX]
# Nasdaq-100 index. The plan has real-time NDX options but no real-time index bars or snapshot, so:
options_symbol = "I:NDX"   # options read (flow, P/C, IV, walls, contracts) from the NDX chain itself
trend_symbol = "QQQ"       # trend from QQQ bars, which track NDX almost exactly
close_symbol = "I:NDX"     # previous close from NDX daily bars; the live price comes from NDX option quotes
chain_strike_pct = 0.06    # NDX chains are very large; +/-6% keeps each fetch to ~20 pages
note = "trend from QQQ bars · price from NDX option quotes"

[instruments.SPX]
# S&P 500 index, like NDX: trend from SPY, price and options read from the SPX chain (SPX + SPXW).
# The plan has no SPX index bars, so no close_symbol: the previous close is the last price seen the day before.
options_symbol = "I:SPX"
trend_symbol = "SPY"
chain_strike_pct = 0.05    # SPX lists strikes every 5 points with daily expiries; +/-5% keeps fetches bounded
note = "trend from SPY bars · price from SPX option quotes"

[reports]
# A full /trend-style report sent every N minutes while the market is open, aligned to 09:30.
every_minutes = { NDX = 60, META = 10, MSFT = 10 }
# Optional last day (inclusive) for a report; after it the report stops by itself.
until = { META = "2026-10-13", MSFT = "2026-10-13" }
# Unusual options activity across the watchlist (volume > open interest, >= unusual_min_premium, no same-day
# expiries) every N minutes, marking contracts that are new or growing since the previous report. 0 = off.
unusual_every_minutes = 15
unusual_top = 10

[picks]
# Daily spread picks to Telegram: up to one bull call spread and one bear put spread (30-60 days,
# ~0.50/0.25 delta, liquid strikes), or "no trade today" when nothing qualifies. Also: /picks in the bot.
enabled = true
time = "10:00"

[alerts]
# "tiered" (since 2026-10-25): alerts by urgency.
#   Tier 1, sent at once to the group: pullback-over entries and strong alignment, with market/sector context
#     ("⚠️ against market" when SPY/QQQ/IWM or the symbol's sector trend the other way). At most one per
#     symbol and direction per tier1_merge_minutes; extras wait for the next tier-2 batch.
#   Tier 2, one "Changes" message every changes_every_minutes: swing trend and options changes (with
#     hysteresis), call/put wall breaks, IV spikes, alignment ended, market trend, sector ranking.
#   Tier 3: blocks >= report_block_premium go into the unusual-activity report instead of their own alerts.
#   Positions (/buy): private alerts to the owner, see [positions].
# "all": every rule as its own message (trend flips, options flips, blocks, IV spikes, wall breaks, market).
# "strong_alignment": only strong alignment and alignment-ended alerts (used 2026-10-12..24).
# Switching modes resets the alert state quietly, so a switch never sends a burst of stale alerts.
mode = "tiered"
alignment_end_alert = true
changes_every_minutes = 15
tier1_merge_minutes = 30
# Hysteresis: a trend class is entered past change_enter (strong: trend.strong_threshold) and left only when
# the score falls back inside change_exit (strong: strong_exit), so scores wobbling around a line stay quiet.
change_enter = 30
change_exit = 15
strong_exit = 50
# Options flips: tuned 2026-10-26 by replaying Oct 8-23 (40/20 with 2 cycles gave ~88 flips a day; this ~26).
options_enter = 50
options_exit = 25
options_confirm_cycles = 3
# Pullback-over entry: swing UP/STRONG UP, intraday dips to -pullback_dip or lower, then recovers to
# +pullback_recover (confirmed), options not against it. Mirror for downtrends.
pullback_dip = 15
pullback_recover = 35            # was 25; 35 replayed better at 3 days (61% vs 56% in the right direction)
pullback_cooldown_minutes = 120
report_block_premium = 5_000_000
# A new trend or bias must hold for this many consecutive cycles before it is alerted.
confirm_cycles = 2
cooldown_minutes = 30
# Options bias needed before a stock/options disagreement is called a divergence.
divergence_min_options_score = 40
# IV spikes watch the ~30-day ATM IV: the front expiry (0-2 DTE) jumped 3+ points ~300 times a day.
iv_spike_series = "month"       # or "front"
iv_spike_points = 4.0           # ATM IV rise in volatility points ...
iv_spike_window_minutes = 30    # ... within this many minutes
block_cooldown_minutes = 60     # per contract

[daytrade]
# 5-minute EMA 9/21 cross-and-retest day trades (the SPY handout, added 2026-10-26). Untested: entries and their
# management go to the group as PAPER trades, tracked on live option quotes, with a summary at the close.
# Backtest: python -m mias ema-backtest --symbols SPY --start 2026-04-27 --end 2026-10-23
enabled = true
symbols = ["SPY", "QQQ", "NVDA", "TSLA", "META"]
fast = 9
slow = 21
retest_bars = 6            # the pullback into the EMAs must come within 6 candles (30 min) of the cross
confirm_bars = 3           # ... and the confirmation candle within 3 candles of the pullback
start = "09:45"            # ET; times in the handout read as ET (3:10 PM Central would be after the close)
last_entry = "15:00"
close = "15:10"
one_dte_after = "13:00"
contracts = 5
partial = 3
stop = 0.20
first_target = 0.30
trail = [[0.75, 0.50], [1.00, 0.75]]
max_losses_in_row = 2

[positions]
# Rules for positions tracked with /buy (alerts go privately to whoever added the position).
take_profit = 0.55          # spreads: share of max profit
single_take_profit = 0.50   # single options: gain on premium
stop_loss = 0.50            # loss on premium
near_strike_pct = 1.5
time_stop_days = 10         # trading days after entry, unless /buy ... by MM/DD
hard_exit_days = 7          # days before expiry

[telegram]
enabled = true
# Answer /trend, /market, /list, /status, /help from the configured chat (only that chat).
commands = true

[screen]
# Options-tradability screen (~200 symbols) shown on the dashboard. Runs at startup when no result exists,
# then every interval_minutes while the market is open. "Refresh now" on the page is limited to once per 5 min.
enabled = true
interval_minutes = 120

[web]
enabled = true
host = "0.0.0.0"
port = 8080

[storage]
path = "data/mias.db"
retention_days = 30

# MIAS-Claude configuration. Secrets never go here: they come from the environment
# (MASSIVE_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID), optionally via a .env file.

[watchlist]
# The 30 symbols passing the options screen on 2026-10-08 (dashboard /screen, `python -m mias screen`),
# plus the 12 added on 2026-10-24.
# /trend in Telegram works for any symbol, watched or not.
symbols = [
  # Market and macro ETFs
  "SPY", "QQQ", "IWM", "DIA", "TQQQ", "GLD", "SLV", "TLT", "XLE",
  # Semiconductors
  "NVDA", "AMD", "AVGO", "MU", "SNDK", "INTC", "TSM",
  # Mega-cap tech and communication
  "AAPL", "MSFT", "GOOGL", "META", "AMZN", "NFLX", "ORCL", "NOW", "PLTR",
  # Other
  "TSLA", "MSTR", "HOOD", "BAC", "WMT",
  # Added 2026-10-24
  "SOXL", "ARM", "DELL", "IREN", "OKLO", "BE", "GS", "ASTS", "BMNR", "GLXY", "SOFI",
  # Indexes (see [instruments.*])
  "NDX", "SPX",
]
market_symbols = ["SPY", "QQQ", "IWM"]

# Four sectors that tend to rotate (added 2026-10-24). Each has an ETF as its gauge. Members and ETFs are added
# to the watchlist automatically, so a symbol can live here without being repeated above. The sector board
# (ranked by the members' average swing score) heads every digest and the closing summary, and answers /sector.
[sectors.tech]
name = "Tech & Semis"
etf = "SMH"
symbols = ["NVDA", "MU", "AMD", "AVGO", "META", "MSFT", "AMZN", "GOOGL", "AAPL", "PLTR"]

[sectors.financials]
name = "Financials"
etf = "XLF"
symbols = ["GS", "JPM", "V", "HOOD", "COIN"]

[sectors.energy]
name = "Energy"
etf = "XLE"
symbols = ["XOM", "CVX", "OXY", "USO"]

[sectors.defensive]
name = "Defensive"
etf = "XLV"
symbols = ["LLY", "UNH", "COST", "WMT", "PG"]

[schedule]
interval_seconds = 150          # one cycle every 2.5 minutes while the market is open
timezone = "America/New_York"
# Scheduled digests (exchange time). A closing summary is always sent at the close.
digest_times = ["09:50", "11:30", "13:30", "15:30"]

[data]
base_url = "https://api.massive.com"
# Stocks Advanced (real time) since 2026-10-07. Set to 15 if ever back on Stocks Starter.
stock_delay_minutes = 0
max_concurrency = 8
request_timeout_seconds = 20
max_retries = 4
# Chain scope fetched each cycle: expirations up to N days out, strikes within +/- pct of spot.
chain_max_dte = 100            # covers the 50-100 DTE contracts used for swing trades
chain_strike_pct = 0.15
max_chain_pages = 40

[trend]
# Which profile drives the headline trend and the trend-change alerts.
# "swing" suits holding options for weeks; "intraday" reacts within the day.
profile = "swing"
strong_threshold = 60
bias_threshold = 25

[trend.profiles]
swing = { "1w" = 0.35, "1d" = 0.45, "1h" = 0.20 }
intraday = { "5m" = 0.25, "15m" = 0.30, "1h" = 0.30, "1d" = 0.15 }

[options]
# A single contract trading at least this much premium in one cycle is reported as a block.
block_premium = 1_000_000
# Unusual: today's volume exceeds open interest * ratio with at least this much premium.
unusual_min_premium = 500_000
unusual_vol_oi_ratio = 1.0
# Same-day expiries always trade above OI; they still count in flow scores but not as unusual/blocks.
alert_0dte = false
# A symbol trading fewer option contracts than this today has its options read marked thin
# (FICO, for example) and left out of the confidence verdict.
thin_options_volume = 5000

# Number of most recent cycles counted as "recent flow" (6 x 2.5 min = 15 min).
recent_windows = 6
strong_threshold = 60
bias_threshold = 25

# Contracts shown with /trend. "swing" follows the swing trend, "day" follows the intraday trend.
# Liquid = two-sided quote with spread <= max_spread_pct of mid and open interest >= min_oi.
[options.ideas.swing]
min_dte = 50
max_dte = 100
delta = 0.60
max_spread_pct = 10
min_oi = 100

[options.ideas.day]
min_dte = 1          # set 0 to allow same-day expiries
max_dte = 14
delta = 0.45
max_spread_pct = 5
min_oi = 200

[instruments.NDX]
# Nasdaq-100 index. The plan has real-time NDX options but no real-time index bars or snapshot, so:
options_symbol = "I:NDX"   # options read (flow, P/C, IV, walls, contracts) from the NDX chain itself
trend_symbol = "QQQ"       # trend from QQQ bars, which track NDX almost exactly
close_symbol = "I:NDX"     # previous close from NDX daily bars; the live price comes from NDX option quotes
chain_strike_pct = 0.06    # NDX chains are very large; +/-6% keeps each fetch to ~20 pages
note = "trend from QQQ bars · price from NDX option quotes"

[instruments.SPX]
# S&P 500 index, like NDX: trend from SPY, price and options read from the SPX chain (SPX + SPXW).
# The plan has no SPX index bars, so no close_symbol: the previous close is the last price seen the day before.
options_symbol = "I:SPX"
trend_symbol = "SPY"
chain_strike_pct = 0.05    # SPX lists strikes every 5 points with daily expiries; +/-5% keeps fetches bounded
note = "trend from SPY bars · price from SPX option quotes"

[reports]
# A full /trend-style report sent every N minutes while the market is open, aligned to 09:30.
every_minutes = { NDX = 60 }
# Optional last day (inclusive) for a report; after it the report stops by itself, e.g. { META = "2026-10-13" }.
until = {}
# Unusual options activity across the watchlist (volume > open interest, >= unusual_min_premium, no same-day
# expiries) every N minutes, marking contracts that are new or growing since the previous report. 0 = off.
unusual_every_minutes = 15
unusual_top = 10
# Only material new activity is sent. A report goes out when one contract traded >= unusual_material of new premium
# since the previous report (or a one-sided block, a new structure, or the morning open-interest check). Contracts
# with less than unusual_row_min of new premium are counted as minor, not listed. Otherwise one line says nothing
# material happened ("line"), or nothing is sent ("skip"). Each line carries a price check: the stock against its
# VWAP and relative volume, and SPY/QQQ/IWM (market_symbols) against theirs.
unusual_material = 1_000_000
unusual_row_min = 250_000
unusual_quiet = "line"

[picks]
# Daily spread picks to Telegram: up to one bull call spread and one bear put spread (30-60 days,
# ~0.50/0.25 delta, liquid strikes), or "no trade today" when nothing qualifies. Also: /picks in the bot.
enabled = true
time = "10:00"

[alerts]
# "tiered" (since 2026-10-25): alerts by urgency.
#   Tier 1, sent at once to the group: pullback-over entries and strong alignment, with market/sector context
#     ("⚠️ against market" when SPY/QQQ/IWM or the symbol's sector trend the other way). At most one per
#     symbol and direction per tier1_merge_minutes; extras wait for the next tier-2 batch.
#   Tier 2, one "Changes" message every changes_every_minutes: swing trend and options changes (with
#     hysteresis), call/put wall breaks, IV spikes, alignment ended, market trend, sector ranking.
#   Tier 3: blocks >= report_block_premium go into the unusual-activity report instead of their own alerts.
#   Positions (/buy): private alerts to the owner, see [positions].
# "all": every rule as its own message (trend flips, options flips, blocks, IV spikes, wall breaks, market).
# "strong_alignment": only strong alignment and alignment-ended alerts (used 2026-10-12..24).
# Switching modes resets the alert state quietly, so a switch never sends a burst of stale alerts.
mode = "tiered"
# 2026-11-09 (user): per-symbol alerts (pullback, swing trend, trend / options changes, wall breaks, IV spikes,
# blocks and the unusual-activity listings) are posted only for these symbols. Every watched symbol is still
# evaluated (sector board, market line, scorecard reads, position alerts, /trend). Empty list = every watched symbol.
symbols = ["SPY", "QQQ", "IWM", "NVDA", "TSLA", "META", "MSFT", "AAPL", "AMZN", "AMD", "COST", "PG", "WMT"]
# Tier-1 trend alert: "swing" = instantly when a symbol's swing trend turns UP / STRONG UP or DOWN / STRONG DOWN
# (the same confirmed, hysteresis-filtered change as the tier-2 trend change), with intraday and options on the card
# and "full strong alignment" noted when all three agree. "strong" = only full strong alignment (until 2026-11-09).
tier1_trend = "swing"
# Morning roll-call: once a day from this time, one card per alert symbol whose swing trend is UP or DOWN. "" = off.
rollcall_time = "09:45"
alignment_end_alert = true
changes_every_minutes = 15
tier1_merge_minutes = 30
# Hysteresis: a trend class is entered past change_enter (strong: trend.strong_threshold) and left only when
# the score falls back inside change_exit (strong: strong_exit), so scores wobbling around a line stay quiet.
change_enter = 30
change_exit = 15
strong_exit = 50
# Options flips: tuned 2026-10-26 by replaying Oct 8-23 (40/20 with 2 cycles gave ~88 flips a day; this ~26).
options_enter = 50
options_exit = 25
options_confirm_cycles = 3
# Pullback-over entry: swing UP/STRONG UP, intraday dips to -pullback_dip or lower, then recovers to
# +pullback_recover (confirmed), options not against it. Mirror for downtrends.
pullback_dip = 15
pullback_recover = 35            # was 25; 35 replayed better at 3 days (61% vs 56% in the right direction)
pullback_cooldown_minutes = 120
report_block_premium = 5_000_000
# A new trend or bias must hold for this many consecutive cycles before it is alerted.
confirm_cycles = 2
cooldown_minutes = 30
# Options bias needed before a stock/options disagreement is called a divergence.
divergence_min_options_score = 40
# IV spikes watch the ~30-day ATM IV: the front expiry (0-2 DTE) jumped 3+ points ~300 times a day.
iv_spike_series = "month"       # or "front"
iv_spike_points = 4.0           # ATM IV rise in volatility points ...
iv_spike_window_minutes = 30    # ... within this many minutes
block_cooldown_minutes = 60     # per contract

[daytrade]
# 5-minute EMA 9/21 cross-and-retest day trades (the SPY handout, added 2026-10-26). Untested: entries and their
# management go to the group as PAPER trades, tracked on live option quotes, with a summary at the close.
# Backtest: python -m mias ema-backtest --symbols SPY --start 2026-04-27 --end 2026-10-23
enabled = true
symbols = ["SPY", "QQQ", "IWM", "NVDA", "TSLA", "META", "MSFT", "AAPL", "AMZN", "AMD", "PG"]  # PG added 2026-11-10 (user)
fast = 9
slow = 21
retest_bars = 6            # the pullback into the EMAs must come within 6 candles (30 min) of the cross
confirm_bars = 3           # ... and the confirmation candle within 3 candles of the pullback
start = "09:35"            # ET, first entry (was 09:45; EMAs are warm from earlier days, the range check needs 15 min)
last_entry = "15:00"
close = "15:10"
one_dte_after = "13:00"
contracts = 5
partial = 3
stop = 0.20
first_target = 0.30
trail = [[0.75, 0.50], [1.00, 0.75]]
max_losses_in_row = 2
manage_seconds = 30        # open paper trades are re-priced this often between the 150 s cycles
swing_filter = false       # true: skip entries against the swing trend (see the backtest's swing split first)
# Two paper strategies on the same crosses, each with its own record, alerts and closing summary:
# retest = cross, pullback into the EMAs, confirmation candle; cross = enter at the crossing candle's close.
# 2026-11-09: "retest" (Strategy A) RETIRED from active paper trading by removing it from this list. It failed the
# 4-year backtest (8,932 trades, -$365,800) and forward paper (73 trades, -$9,428 net). Its code (emacross
# STRATEGIES["retest"], scan(retest=True)) and its logged trades are kept, so its results stay reproducible and
# reportable (python -m mias paper-scorecard, /strategies). Re-adding "retest" here would run it again.
# 2026-11-13 00:59 ET: "cross" (Strategy B) PAUSED from new forward paper entries by removing it from this list
# (user decision: 4-year replay 17,718 trades, -$809,529, negative every year; bid/ask research did not rescue it;
# forward paper runner-dependent and noisy). No B position was open. Its code (emacross STRATEGIES["cross"]), logged
# trades, scorecard history, replays and backtests are kept as a benchmark; re-adding "cross" here runs it again.
strategies = ["qualified", "ema_9_21_d", "ema_9_21_e7", "ema_9_21_e21"]
# "qualified" = EXPERIMENTAL Strategy C ([ema_qualified]); "ema_9_21_d" = EXPERIMENTAL Strategy D: the backtested
# "A + trend + time windows" rule with a +50% first target and the -20% stop, fixed in code (mias/qualify.py D_GATES).
# "ema_9_21_e7" / "ema_9_21_e21" = EXPERIMENTAL E7 / E21: D's signal with a 7DTE / 21DTE ~0.50-delta contract,
# all-out at +25% / +30%, -20% stop (mias/dte.py); the 10-minute close confirmation is logged, never used.
# Live-paper session only: remove either name to stop it. Neither runs unless listed here.
fee_per_contract = 0.65    # commission per contract per side, taken off in the weekly strategy report
# Paper fills are realistic: bought at the ask, sold at the bid (never above the trigger price); the midpoint
# result is shown alongside. Every closed trade is logged with MFE/MAE, stop distances, spread, fill delay and the
# trend at entry: python -m mias ema-log

[ema_simple]
# EXPERIMENTAL "EMA 9/21 Simple — SPY / QQQ / IWM" (mias/simple.py), paper only, a frozen benchmark: a completed
# 5-minute candle whose EMA 9/21 state changed (no retest, trend, VWAP or any other gate), the first two such signals
# per symbol per day (each symbol counted separately), ATM call / put on the 0DTE (next expiry from 13:00), 5 contracts
# bought at the ask, all sold at the bid at +25% or -20% (judged on the mid) or at 15:10. Its own state, log and
# alerts; A-E21 are untouched. Trades only SPY, QQQ, IWM (their 5-minute bars are fetched whenever this is on).
# 2026-11-13 00:59 ET: PAUSED from new forward paper entries (user decision: 4-year entry history negative every
# year; exit research cut losses but found no entry edge). No Simple position was open. Code, logged trades,
# scorecard history, replay and exit research are kept as a frozen benchmark; enabled = true runs it again.
enabled = false

[ema_qualified]
# EXPERIMENTAL Strategy C (mias/qualify.py), test-only, paper: the retest setup (A) traded only when it qualifies.
# Runs when "qualified" is in [daytrade] strategies; A and B are untouched controls. Every cross is logged as
# WATCH / REJECT (with reasons) / TRADE. Report: python -m mias ema-compare (also posted after the close).
# Values are first-test defaults, deliberately not tuned to the 23 trades seen so far.
trend_only = true            # regime must be "trend" (ADX >= 25 and the day moved 40% of an average range)
require_vwap = true          # calls above VWAP, puts below
require_slope = true         # EMA 9 and EMA 21 both sloping the trade's way over slope_bars candles (sign only)
require_or = true            # price on the trade's side of the 15-min opening-range midpoint; no range = reject
require_market = false       # SPY/QQQ alignment: logged, not a gate
min_separation_pct = 0.0     # |EMA9-EMA21| / price: logged, not a gate
sessions = [["09:35", "11:00"], ["13:30", "14:30"]]   # entry-candle close, ET
no_entries_after = "14:45"
max_spread_pct = 8.0
whipsaw_window_minutes = 30
whipsaw_flips = 2            # 2 opposite flips (3 crosses) within the window lock the symbol
cooldown_minutes = 60
slope_bars = 3
vwap_hold_bars = 3

[closeplay]
# 3:45 PM close play, paper-traded (python -m mias close-backtest): at 15:45 ET, when the day's move, the VWAP side
# and the last 45 minutes all point the same way, buy the 0DTE ATM option AGAINST them (the closing pullback) and
# sell at 15:59. Otherwise NO TRADE. Posted to the group every day at ~15:45. The read comes from SPY's bars (the
# plan has no SPX index bars); the trade is the SPX 0DTE (SPXW) ATM option, ~10x a SPY contract.
# Backtest, SPY 2024-10 to 2026-10: right 59% of the time, +$6.4 per contract after costs, PF 1.34, both years
# positive; thin (+$2.4 with 3 cents of slippage).
enabled = true
symbol = "SPY"             # the 15:45 read
trade = "SPX"              # the option traded (SPY to trade SPY 0DTE instead)
contracts = 1

[premarket]
# Pre-market heads-up (and /premarket anytime): the first time gets yesterday's sector board, pre-market moves of
# SPY/QQQ/IWM, the sector ETFs and the biggest gappers (volume vs normal for the time of day, gaps against the
# trend flagged) and estimated earnings; later times are short updates marking each sector ✅ held / ⚠️ flipped
# against the first read. Weekdays only; nothing is sent on a holiday (no pre-market trades).
enabled = true
times = ["07:00", "09:15"]

[brief]
# The day-trade brief at 09:45 ET (and /brief anytime): SPY/QQQ/IWM opening read, trend or chop day, the leading
# sector, 3-5 day-trade candidates (relative volume x opening move, liquid options only) and key levels.
enabled = true
time = "09:45"

[positions]
# Rules for positions tracked with /buy (alerts go privately to whoever added the position).
take_profit = 0.55          # spreads: share of max profit
single_take_profit = 0.50   # single options: gain on premium
stop_loss = 0.50            # loss on premium
near_strike_pct = 1.5
time_stop_days = 10         # trading days after entry, unless /buy ... by MM/DD
hard_exit_days = 7          # days before expiry

[telegram]
enabled = true
# Answer /trend, /market, /list, /status, /help from the configured chat (only that chat).
commands = true
# Delivery policy only (2026-11-17): alerts with these rules are still queued, logged and kept in the alerts
# table (marked "muted: telegram policy"), but never sent. The strategies behind them (EMA C / D / E7 / E21,
# paused B and Simple, the 3:45 close fade) keep trading on paper exactly as before; entries, exits, fills, P/L,
# logs, scorecards and reports are unchanged. Early Watch v1 / v2 are sent by mias-observer, not from here.
#   ema_entry                                 every EMA paper entry (A / B / C / D / E7 / E21)
#   ema_partial ema_trail ema_target          EMA first target, trail raised, all-out target
#   ema_stop ema_breakeven ema_trailed        EMA stop, runners at breakeven, trailed out
#   ema_invalidated ema_time                  EMA chart invalidation, 15:10 force close
#   ema_simple                                Simple EMA (SPY / QQQ / IWM) entries and exits
#   closeplay                                 3:45 close fade: the 15:45 call / put / no-trade read and the 15:59 sale
# Not muted: ema_summary (the once-a-day 15:10 EMA paper summaries), system, scorecard, strategies, and every
# market / options alert. Remove a rule here to send it again.
muted_rules = ["ema_entry", "ema_partial", "ema_trail", "ema_target", "ema_stop", "ema_breakeven", "ema_trailed",
               "ema_invalidated", "ema_time", "ema_simple", "closeplay"]

[screen]
# Options-tradability screen (~200 symbols) shown on the dashboard. Runs at startup when no result exists,
# then every interval_minutes while the market is open. "Refresh now" on the page is limited to once per 5 min.
enabled = true
interval_minutes = 120

[web]
enabled = true
host = "0.0.0.0"
port = 8080

[storage]
path = "data/mias.db"
retention_days = 30

[observer]
# Live Observer + Early Watch (added 2026-11-11). A separate process and service:
#   python -m mias.observer run        (deploy/systemd/mias-observer.service)
# It streams Massive WebSocket per-minute bars (AM) for these symbols, keeps its own chart state and logs EARLY WATCH
# events to its own database. It never trades, never writes data/mias.db and never calls the strategy engines; it only
# reads MIAS data to link watches to the confirmed events that followed. The rules are frozen in
# mias/observer/rules.py and docs/observer/PREREGISTRATION.md.
enabled = true
symbols = ["SPY", "QQQ", "IWM", "NVDA", "TSLA", "META", "MSFT", "AAPL", "AMZN", "AMD", "PG"]   # = [daytrade] symbols
ws_url = "wss://socket.massive.com/stocks"
db_path = "data/observer/observer.db"
cache_dir = "data/observer/cache"
minute_grace_seconds = 5      # a minute is evaluated when every symbol reported it, or 5 s after it ended
watchdog_seconds = 150        # no AM message for this long during the session forces a reconnect
connect_from = "04:00"        # ET, weekdays: extended-hours bars are recorded (validation), only 09:30-16:00 evaluated
connect_until = "20:05"
confirm_poll_seconds = 20     # read-only poll of MIAS confirmed events (paper entries, swing / strong alerts)
# 2026-11-11 (user): Telegram PILOT for live validation. Only the initial message of a main-lane watch (09:45-15:00,
# frozen v1 caps) is sent, plain text, WATCH ONLY; no invalidation / expiry / upgrade / suppression messages, no
# 09:30-09:45 candidates, nothing found late by a restart backfill. Same bot and alert chats as MIAS. false = log only.
telegram = true
telegram_max_age_seconds = 180
# 2026-11-11 (user): Early Watch v2 RESEARCH (post-hoc hypotheses, docs/observer/V2_PREREGISTRATION.md, frozen at
# 934a2e2): structure / VWAP / opening-range families, EMA as context only, own database. v1 above is the control and
# is unchanged. v2 Telegram: own policy (1 per family / symbol / side / setup, families combined within 5 min, 6 per
# hour, main lane 09:45-15:00 only), messages end "RESEARCH WATCH ONLY — NOT A TRADE SIGNAL".
v2 = true
v2_db_path = "data/observer/v2.db"
v2_telegram = true
# 2026-11-16 (user): V2-A Structure is a Telegram-only mute. Structure is still detected, stored, given options
# context, tracked and scored in every v2 report; it just never sends a message of its own. A VWAP / opening-range
# message still lists Structure when a Structure watch is open on the same symbol / side. Delivery policy only.
v2_telegram_muted_families = ["structure"]
